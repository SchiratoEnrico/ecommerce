<div class="page-wrapper">

    <div class="page-header">
        <div class="page-header-left">
            <h1 class="page-title ps-3">Gestione Carrelli</h1>
        </div>

        <div class="page-header-right ps-3">
            <span class="badge-count">{{ dataSource.data.length }} risultati</span>
        </div>
    </div>

    <div class="card table-card">
        <div class="table-wrap">
            <table mat-table [dataSource]="dataSource" matSort class="full-width-table ps-3">
                
                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

                <tr mat-row *matRowDef="let row; columns: displayedColumns;"
                    style="cursor:pointer" class="hover-row"></tr>

                <ng-container matColumnDef="numeroElenco">
                    <th mat-header-cell *matHeaderCellDef> # </th>
                    <td mat-cell *matCellDef="let e; let i = index">{{ i + 1 }}</td>
                </ng-container>

                <ng-container matColumnDef="id">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>Id Carrello</th>
                    <td mat-cell *matCellDef="let e">{{ e.id }}</td>
                </ng-container>

                <ng-container matColumnDef="idAccount">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>Id Account</th>
                    <td mat-cell *matCellDef="let e">{{ e.account?.id }}</td>
                </ng-container>

                <ng-container matColumnDef="numeroElementi">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>Numero di righe carrello</th>
                    <td mat-cell *matCellDef="let e">{{ e.righe?.length || 0 }}</td>
                </ng-container>

                <ng-container matColumnDef="azioni">
                    <th mat-header-cell *matHeaderCellDef>Azioni</th>
                    <td mat-cell *matCellDef="let e">
                        <button mat-icon-button (click)="details(e); $event.stopPropagation()" matTooltip="Vedi dettagli" style="color: var(--brand-accent);">
                            <mat-icon>visibility</mat-icon>
                        </button>
                    </td>
                </ng-container>

            </table>

            @if(dataSource.data.length === 0){
                <div class="text-center p-5 text-muted">
                    <p>Nessun carrello trovato</p>
                </div>
            }

            <mat-paginator [pageSize]="15"></mat-paginator>
        </div>
    </div>
</div>
