<div class="page-wrapper">

  <!-- HEADER -->
  <div class="page-header">
    <div class="page-header-left">
      <p class="page-eyebrow">Pannello Admin</p>
      <h1 class="page-title">Gestione Spedizioni</h1>
    </div>
    <div class="page-header-right">
      <span class="badge-count">{{ dataSource.data.length }} risultati</span>
    </div>
  </div>
 <!-- AZIONI -->
  <button class="btn-primary" type="button" (click)="openCreateDialog()">
        Nuova
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </button>

      <!-- TABELLA -->
    <div class="card table-card">
      <div class="table-wrap">

        <table mat-table [dataSource]="dataSource" class="full-width-table">

      <!-- ID -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let s">{{ s.id }}</td>
      </ng-container>

      <!-- TIPO SPEDIZIONE -->
      <ng-container matColumnDef="tipoSpedizione">
        <th mat-header-cell *matHeaderCellDef>Tipo Spedizione</th>
        <td mat-cell *matCellDef="let s">{{ s.tipoSpedizione }}</td>
      </ng-container>

      <!-- COSTO SPEDIZIONE --> 
      <ng-container matColumnDef="costoSpedizione">
        <th mat-header-cell *matHeaderCellDef>Costo Spedizione</th>
        <td mat-cell *matCellDef="let s">{{ s.costoSpedizione | currency:'EUR':'symbol' }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="modificaSpedizione(row)" style="cursor:pointer"></tr>

    </table>
            <mat-paginator [pageSize]="10"></mat-paginator>
    </div>
  </div>

</div>
