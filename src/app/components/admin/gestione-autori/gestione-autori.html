<div class="page-wrapper">

  <!-- HEADER -->
  <div class="page-header">
    <div class="page-header-left">
      <p class="page-eyebrow">Pannello Admin</p>
      <h1 class="page-title">Gestione Autori</h1>
    </div>
    <div class="page-header-right">
      <span class="badge-count">{{ dataSource.data.length }} risultati</span>
    </div>
  </div>

  <!-- FILTRI + Aggiunta -->
  <div class="card filter-card">
    <div class="filter-row">
      <mat-form-field appearance="outline">
        <mat-label>Nome</mat-label>
        <input matInput [(ngModel)]="filters.nome" (keyup)="onFilterChange()">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Cognome</mat-label>
        <input matInput [(ngModel)]="filters.cognome" (keyup)="onFilterChange()">
      </mat-form-field>
    </div>

    <div class="actions-group">
      <button class="btn-primary" (click)="resetFilters()">
        Reset
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>
        </svg>
      </button>
      <button class="btn-primary" (click)="openCreateDialog()">
        Nuovo autore
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- TABELLA -->
  <div class="card table-card">
    <div class="table-wrap">
      <table mat-table [dataSource]="dataSource" matSort class="full-width-table">

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="edit(row)" style="cursor:pointer"></tr>

        <!-- ID -->
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
          <td mat-cell *matCellDef="let e" class="td-id">{{ e.id }}</td>
        </ng-container>

        <!-- NOME -->
        <ng-container matColumnDef="nome">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Nome</th>
          <td mat-cell *matCellDef="let e" class="td-bold">{{ e.nome }}</td>
        </ng-container>

        <!-- COGNOME -->
        <ng-container matColumnDef="cognome">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Cognome</th>
          <td mat-cell *matCellDef="let e">{{ e.cognome }}</td>
        </ng-container>

        <!-- DATA NASCITA -->
        <ng-container matColumnDef="dataNascita">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Data di nascita</th>
          <td mat-cell *matCellDef="let e">{{ e.dataNascita | date:'dd/MM/yyyy' }}</td>
        </ng-container>

        <!-- DESCRIZIONE -->
        <ng-container matColumnDef="descrizione">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Descrizione</th>
          <td mat-cell *matCellDef="let e" class="td-desc">{{ e.descrizione }}</td>
        </ng-container>

      </table>

      <mat-paginator [pageSize]="15"></mat-paginator>
    </div>
  </div>

</div>
