<h2 mat-dialog-title>
  {{ data.riga ? 'Modifica Voce' : 'Aggiungi Prodotto' }}
</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="riga-form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>ISBN</mat-label>
      <input matInput formControlName="isbn">
    </mat-form-field>

    <div class="form-grid-2">
      <mat-form-field appearance="outline">
        <mat-label>Prezzo Unitario (€)</mat-label>
        <input matInput type="number" step="0.01" formControlName="prezzoUnitario">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Quantità</mat-label>
        <input matInput type="number" formControlName="numeroCopie" min="1">
      </mat-form-field>
    </div>

    <div class="riga-preview-totale">
      <span>Totale riga stimato:</span>
      <strong>{{ totaleRiga | currency:'EUR' }}</strong>
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()" [disabled]="loading">Chiudi</button>

  <!-- Pulsante elimina: solo in modifica -->
  <button *ngIf="isEdit" mat-button color="warn" (click)="delete()" [disabled]="loading">
    Elimina
  </button>

  <button mat-raised-button color="primary" (click)="save()"
    [disabled]="form.invalid || loading">
    {{ loading ? 'Salvataggio...' : 'Conferma' }}
  </button>
</mat-dialog-actions>
