<div class="container mt-5">
    <div class="row mb-4">
        <div class="col-md-8">
            <h1 class="page-title">Gestione Tipi di Pagamento</h1>
        </div>
        <div class="col-md-4 text-end">
            <button class="btn btn-primary btn-lg" (click)="openAddModal()">
                <i class="fas fa-plus"></i> Aggiungi Pagamento
            </button>
        </div>
    </div>

    <!-- Tabella Pagamenti -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Id</th>
                        <th>Tipo Pagamento</th>
                        <th>Azioni</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let pagamento of pagamenti(); trackBy: trackById">
                        <td>{{ pagamento.id }}</td>
                        <td>{{ pagamento.tipo_pagamento }}</td>
                        <td>
                            <button class="btn btn-sm btn-warning me-2" (click)="openEditModal(pagamento)">
                                <i class="fas fa-edit"></i> Modifica
                            </button>
                            <button class="btn btn-sm btn-danger" (click)="deletePagamento(pagamento.id)">
                                <i class="fas fa-trash"></i> Elimina
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
            <div *ngIf="pagamenti().length === 0" class="text-center p-5 text-muted">
                <p>Nessun tipo di pagamento trovato</p>
            </div>
        </div>
    </div>
</div>

<!-- Modal Aggiungi/Modifica -->
<div class="modal fade" [class.show]="isModalOpen" [style.display]="isModalOpen ? 'block' : 'none'" tabindex="-1"
    [attr.aria-hidden]="!isModalOpen">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">{{ isEditMode ? 'Modifica' : 'Aggiungi' }} Pagamento</h5>
                <button type="button" class="btn-close" (click)="closeModal()"></button>
            </div>
            <div class="modal-body">
                <form [formGroup]="pagamentoForm">
                    <div class="mb-3">
                        <label for="tipo_pagamento" class="form-label">Tipo Pagamento</label>
                        <input type="text" class="form-control" id="tipo_pagamento" formControlName="tipo_pagamento" required>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" (click)="closeModal()">Annulla</button>
                <button type="button" class="btn btn-primary" (click)="savePagamento()">Salva</button>
            </div>
        </div>
    </div>
</div>

<div *ngIf="isModalOpen" class="modal-backdrop fade show"></div>
