<div class="login-wrapper">
  <div class="form-container">
    <div class="form-header">
      <p class="form-eyebrow">Recupero Account</p>
      <h1 class="form-title">Password dimenticata?</h1>
    </div>

    @if (isSuccess()) {
      <div style="text-align: center; color: var(--text-secondary); font-size: 0.95rem; line-height: 1.6;">
        <svg style="color: var(--brand-accent); margin-bottom: 1rem;" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        <p>{{ msg() }}</p>
        <br>
        <button class="btn-register" type="button" (click)="goLogin()">Torna al Login</button>
      </div>
    } @else {
      <form #forgotForm="ngForm" (ngSubmit)="onSubmit(forgotForm)" class="login-form" novalidate>
        
        <p style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.5rem;">
          Inserisci l'indirizzo email associato al tuo account. Ti invieremo un link per reimpostare la tua password.
        </p>

        <div class="field-group" [class.field-error]="email.invalid && email.touched">
          <label for="email" class="field-label">Email</label>
          <div class="field-input-wrap">
            <svg class="field-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 7 10-7"/>
            </svg>
            <input id="email" class="field-input" type="email" name="email" placeholder="La tua email" ngModel required email #email="ngModel" />
          </div>
        </div>

        @if (msg()) {
          <div class="server-error">
             <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            {{ msg() }}
          </div>
        }

        <div class="form-actions">
          <button class="btn-login" type="submit" [disabled]="!forgotForm.valid">
            <span>Invia Link</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
          </button>
          <a align="center" class="back-home" (click)="goLogin()" style="margin-top: 10px;">← Annulla e torna al login</a>
        </div>
      </form>
    }
  </div>
</div>
